# dev.jir3d.com -> http
server {
    client_max_body_size 20M;
    listen 80;
    listen [::]:80;

    server_name dev.jir3d.com www.dev.jir3d.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dev.jir3d.com$request_uri;
    }
}
#dev.jir3d.com -> https
server {
    client_max_body_size 20M;
    listen 443 ssl http2;
    #listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name dev.jir3d.com;

    ssl_certificate /etc/nginx/ssl/live/dev.jir3d.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/dev.jir3d.com/privkey.pem;
    
    location / {
        proxy_pass http://172.28.5.254:3000;  
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

