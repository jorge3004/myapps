services:
  nodejs:
    container_name: nodejs
    image: nodejs
    networks:
      - jir3d
    build:
      context: ./NODE
      target: prod
    ports:
      - ${NODE_PUBLISHED_PORT}:${NODE_TARGET_PORT}
    environment:
      - NODE_TARGET_PORT=${NODE_TARGET_PORT}
      - SECRETORPRIVATEKEY=${SECRETORPRIVATEKEY}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - ./NODE:/app
      - nodejs:/app/node_modules
    # image: node-prod

  reactjs:
    # volumes:
    #   - ./REACT/dist:/usr/share/nginx/html
    ports:
      - ${REACT_PUBLISHED_PORT}:80
    container_name: reactjs
    image: reactjs
    build:
      context: ./REACT
      target: prod
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    # restart: always
    # stop_grace_period: "3s"
    networks:
      - jir3d
    # environment:
    #   - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
volumes:
  nodejs:


networks:
  jir3d:
    name: jir3d
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24
          gateway: ${GATEWAY_IP}
