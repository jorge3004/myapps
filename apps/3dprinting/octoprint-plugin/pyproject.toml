[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-MyApps3D"
version = "0.1.0"
description = "Plugin hello world: reporta el estado de OctoPrint al backend 3DPrinting"
requires-python = ">=3.9"

[project.entry-points."octoprint.plugin"]
myapps3d = "octoprint_myapps3d"

[tool.setuptools]
packages = ["octoprint_myapps3d"]
